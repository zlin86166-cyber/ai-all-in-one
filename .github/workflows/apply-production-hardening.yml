name: Apply Production Hardening
on:
  push:
    branches: [main]
    paths:
      - tools/apply_production_hardening.py
      - tools/fix_production_hardening_migration.py
      - .github/workflows/apply-production-hardening.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply migration
        run: |
          python tools/apply_production_hardening.py
          python tools/fix_production_hardening_migration.py
      - name: Run tests
        run: python -m unittest discover -v
      - name: Commit hardened runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The default Actions token cannot create workflow files. Those are added
          # separately through the authorized GitHub connector after this commit.
          rm -f .github/workflows/ci.yml .github/workflows/windows-build.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: harden AI Hub runtime and integrate recovery/security"
          git push origin HEAD:main
