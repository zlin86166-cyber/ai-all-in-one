name: Apply Operator Completion
on:
  push:
    branches: [main]
    paths:
      - tools/apply_operator_completion.py
      - .github/workflows/apply-operator-completion.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply operator completion
        run: python tools/apply_operator_completion.py
      - name: Syntax check
        run: python -m compileall -q ai_hub training tools
      - name: Test
        run: python -m unittest discover -v
      - name: Commit completed operator surface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: complete operator UI, truthful progress and training workflow"
          git push origin HEAD:main
